name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Quality Gate & Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'tools/release/package-lock.json'

      - name: Install Node Dependencies
        run: npm ci --prefix tools/release || npm install --prefix tools/release

      - name: Validate Conventional Commits (Commitlint)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Linting PR commits between ${{ github.event.pull_request.base.sha }} and ${{ github.event.pull_request.head.sha }}..."
            npx --prefix tools/release commitlint --config tools/release/commitlint.config.js --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          else
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              echo "Linting pushed commits between ${{ github.event.before }} and ${{ github.sha }}..."
              npx --prefix tools/release commitlint --config tools/release/commitlint.config.js --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
            else
              echo "Linting latest commit on push..."
              npx --prefix tools/release commitlint --config tools/release/commitlint.config.js --last --verbose
            fi
          fi

      - name: Set up OpenJDK 26
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .config/gitleaks.toml

      - name: Quality Gate (Spotless, ArchUnit, Tests, JaCoCo & CycloneDX SBOM)
        run: ./gradlew check --stacktrace

      - name: Build Hardened Container Image
        run: docker build -t ms-template-java:ci .

      - name: Vulnerability Scan (Trivy Container & Misconfig)
        run: |
          echo "Scanning container image with Trivy..."
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ github.workspace }}:/workspace" -w /workspace aquasec/trivy:latest image --config .config/trivy.yaml ms-template-java:ci
          echo "Scanning Dockerfile configuration with Trivy..."
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace aquasec/trivy:latest config --config .config/trivy.yaml Dockerfile

      - name: Scan CycloneDX SBOM with Trivy
        run: |
          echo "Scanning CycloneDX SBOM with Trivy..."
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace aquasec/trivy:latest sbom --config .config/trivy.yaml app/build/reports/cyclonedx-direct/bom.json

      - name: SAST Security Scan (Semgrep)
        run: task security:sast

      - name: Upload Test & Coverage Reports
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
          retention-days: 14

      - name: Upload Software Bill of Materials (SBOM)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: sbom-cyclonedx
          path: |
            app/build/reports/cyclonedx-direct/
            app/build/reports/cyclonedx/
          retention-days: 30
