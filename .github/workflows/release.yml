name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up OpenJDK 26
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --stacktrace

      - name: Set up Node.js
        uses: actions/setup-node@1a4442cacd436585916779262731c5b162bc6ec7 # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'tools/release/package-lock.json'

      - name: Install Node Dependencies
        run: npm ci --prefix tools/release || npm install --prefix tools/release

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --prefix tools/release semantic-release --extends ./tools/release/.releaserc.json
